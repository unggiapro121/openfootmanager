[package]
name = "engine"
version = "0.4.0"
edition = "2024"
publish = false

[dependencies]
rand = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
# Calibration knob files (sim-bench and probes only; phase 2, GĐ5 P5.0).
serde_json = "1.0"
# TypeScript declarations for the types that cross to a client (phase 3, E3-6a). Off by default:
# only the test-only crate `ofm-bindings` turns it on, so a game or server build never compiles ts-rs.
ts-rs = { version = "12.0.1", optional = true }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
rand_chacha = "0.10"

[lints]
workspace = true
