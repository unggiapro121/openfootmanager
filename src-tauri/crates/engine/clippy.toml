# A match must be a pure function of its inputs and its seed: the online server (phase 3) replays
# a match from those and compares the result minute by minute. Anything that reads the operating
# system's entropy or the wall clock breaks that, so it is a lint error in this crate, tests
# included. Take an `&mut impl Rng` from the caller instead, seeded by name (ChaCha12).
disallowed-methods = [
    { path = "rand::rng", reason = "OS entropy is not replayable; take a seeded `&mut impl Rng` from the caller" },
    { path = "rand::random", reason = "OS entropy is not replayable; take a seeded `&mut impl Rng` from the caller" },
    { path = "std::time::SystemTime::now", reason = "the wall clock is not an input of a match" },
    { path = "std::time::Instant::now", reason = "the wall clock is not an input of a match" },
]
