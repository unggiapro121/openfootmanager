[package]
name = "ofm-rules"
version = "0.3.0"
edition = "2024"
publish = false
description = "Pure game rules shared by the OpenFoot Manager game and its online server"

[dependencies]
domain = { version = "0.3.0", path = "../domain" }
# The match session (E3-3) drives the engine; the engine still knows nothing of `domain`.
engine = { version = "0.4.0", path = "../engine" }
rand = "0.10"
# Named, not `rand::rngs::StdRng`: rand reserves the right to change what StdRng is, and a rule
# keyed on an id must give the same answer after a dependency bump.
rand_chacha = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
# The minute hash is taken over a canonical serialisation of each step's summary.
serde_json = "1.0"
# TypeScript declarations for the types that cross to a client (phase 3, E3-6a). Off by default:
# only the test-only crate `ofm-bindings` turns it on, so a game or server build never compiles ts-rs.
ts-rs = { version = "12.0.1", optional = true }

[features]
ts = ["dep:ts-rs", "domain/ts", "engine/ts"]

[lints]
workspace = true
