[package]
name = "ofm-bindings"
version = "0.1.0"
edition = "2024"
publish = false
description = "Test-only: the TypeScript declarations of the core types that cross to a client"

# Everything is a dev-dependency, so the `ts` feature (and ts-rs) is compiled only for this
# crate's tests and never reaches the game's build (E3-6-tech-spec.md §3.2).
[dev-dependencies]
domain = { version = "0.3.0", path = "../domain", features = ["ts"] }
engine = { version = "0.5.0", path = "../engine", features = ["ts"] }
ofm-rules = { version = "0.3.0", path = "../ofm-rules", features = ["ts"] }
ts-rs = "12.0.1"

[lints]
workspace = true
